  <!-- Toegankelijke, crawlbare kop voordat React laadt -->
  <noscript>
    <h1>Luchthaventaxi vergelijken — vaste prijs naar Schiphol, Eindhoven en Düsseldorf</h1>
    <p>Vaste prijzen voor luchthavenvervoer vanaf Almere, het Gooi en Flevoland. Bel 036 2222222 of boek op airportservicealmere.nl.</p>
  </noscript>

  <div id="root"></div>

  <script type="text/babel" src="Scene.jsx"></script>
  <script type="text/babel" src="app/Background.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Results.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [origin, setOrigin] = useState(null);
      const [destination, setDestination] = useState(null);
      const [pax, setPax] = useState("sedan");
      const [raw, setRaw] = useState([]);
      const [busy, setBusy] = useState(false);
      const [summary, setSummary] = useState(null);

      function compare() {
        if (!origin || !destination) return;
        setBusy(true); setRaw([]);
        setTimeout(() => {
          const m = window.Geo.metrics(origin, destination);
          const trip = {
            origin, destination,
            originCity: origin.city, destinationCity: destination.city,
            distanceKm: m.km, durationMinutes: m.minutes,
          };
          let qs = window.quotesFor(trip, new Date());
          if (pax === "van") {
            qs = qs.map((q) => {
              const f = q.provider === "TaxiGeld" ? 1.2 : (q.provider === "Lokale taxi" ? 1.4 : 1.5);
              return { ...q, price: Math.round(q.price * f), note: null };
            }).sort((a, b) => a.price - b.price);
          }
          setRaw(qs);
          setSummary(`${m.km.toFixed(1)} km · ±${m.minutes} min rijden (schatting)`);
          setBusy(false);
          if (navigator.vibrate) navigator.vibrate(10);
          const el = document.getElementById("uitkomst");
          if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 420);
      }

      function pickAirport(place) {
        setDestination(place);
        document.getElementById("vergelijk").scrollIntoView({ behavior: "smooth" });
      }

      return (
        <React.Fragment>
          <TrafficBackground />
          <Header />
          <Hero origin={origin} destination={destination} pax={pax}
                setOrigin={setOrigin} setDestination={setDestination} setPax={setPax}
                onCompare={compare} busy={busy} />
          <Results raw={raw} origin={origin} destination={destination} summary={summary} />
          <AirportsGrid onPick={pickAirport} />
          <WhyCards />
          <CtaBand />
          <Footer />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
