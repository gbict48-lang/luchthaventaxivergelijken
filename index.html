<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>TaxiGeld — vergelijk taxiritten</title>
  <meta name="theme-color" content="#0d0f14" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="app.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="data.js"></script>
  <script src="places.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Globe.jsx"></script>
  <script type="text/babel" src="Background.jsx"></script>
  <script type="text/babel" src="Compare.jsx"></script>
  <script type="text/babel">
    const { useState, useMemo } = React;

    function App() {
      const [origin, setOrigin] = useState(null);
      const [destination, setDestination] = useState(null);
      const [when, setWhen] = useState(null);          // null = nu
      const [editing, setEditing] = useState(null);     // 'origin' | 'destination'
      const [loading, setLoading] = useState(false);
      const [raw, setRaw] = useState([]);
      const [summary, setSummary] = useState(null);
      const [sortOption, setSort] = useState("cheapest");
      const [spin, setSpin] = useState(1);

      const canCompare = origin && destination && !loading;

      const quotes = useMemo(() => {
        const q = raw.slice();
        if (sortOption === "cheapest") q.sort((a, b) => a.price - b.price);
        else if (sortOption === "fastest") q.sort((a, b) => a.pickupEtaMinutes - b.pickupEtaMinutes);
        else q.sort((a, b) => b.rating - a.rating);
        return q;
      }, [raw, sortOption]);

      const prices = raw.map((q) => q.price);
      const maxPrice = prices.length ? Math.max(...prices) : 0;
      const minPrice = prices.length ? Math.min(...prices) : 0;
      const cheapestId = raw.length ? raw.reduce((m, q) => q.price < m.price ? q : m).provider : null;
      const priceRank = (q) => raw.slice().sort((a, b) => a.price - b.price).findIndex((x) => x.provider === q.provider) + 1;

      function swap() { setOrigin(destination); setDestination(origin); setRaw([]); setSummary(null); }

      function compare() {
        if (!canCompare) return;
        setLoading(true); setRaw([]); setSummary(null);
        setSpin(7); setTimeout(() => setSpin(1.6), 2600);
        const date = when || new Date();
        // tiny delay so the spinner + globe dive read as "working"
        setTimeout(() => {
          const m = window.Geo.metrics(origin, destination);
          const trip = {
            origin, destination,
            originCity: origin.city, destinationCity: destination.city,
            distanceKm: m.km, durationMinutes: m.minutes,
          };
          const qs = window.quotesFor(trip, date);
          setRaw(qs);
          setSummary(`${m.km.toFixed(1)} km · ±${m.minutes} min rijden (schatting)`);
          setLoading(false);
          if (window.navigator.vibrate) window.navigator.vibrate(12);
        }, 650);
      }

      function act(quote) { window.Booking.open(quote.provider, origin, destination); }

      return (
        <React.Fragment>
          <TrafficBackground />
          <div className="app">
            <div className="topbar">
              <div className="brandmark"><span className="badge">€</span>TaxiGeld</div>
              <a className="call" href="tel:0362222222"><Icon name="phone" size={14} />036 2222222</a>
            </div>

            <div className="hero">
              <DotGlobe spin={spin} />
              <div className="hero-text">
                <h1>TaxiGeld</h1>
                <p>{raw.length ? "Je rit, scherp geprijsd ✨" : "Vergelijk de wereld rond 🌍"}</p>
              </div>
            </div>

            <RouteCard origin={origin} destination={destination}
                       onEdit={setEditing} onSwap={swap} />
            <WhenField value={when} onChange={setWhen} />

            <button className="btn-primary" disabled={!canCompare} onClick={compare}>
              {loading
                ? <React.Fragment><span className="spinner"></span>Prijzen ophalen…</React.Fragment>
                : <React.Fragment><Icon name="search" size={18} stroke={2.4} />Vergelijk prijzen</React.Fragment>}
            </button>

            {summary && (
              <div className="trip-summary"><Icon name="route" size={15} />{summary}</div>
            )}

            {raw.length > 0 && (
              <React.Fragment>
                <SortPicker value={sortOption} onChange={setSort} />
                <div className="results-head">
                  <span className="save">{maxPrice - minPrice >= 1 ? "💸 Bespaar tot " + window.euro(maxPrice - minPrice) : (raw.length + " opties")}</span>
                  <span className="count">{raw.length} opties</span>
                </div>
                <div className="results">
                  {quotes.map((q) => (
                    <ResultCard key={q.provider} quote={q}
                                cheapest={q.provider === cheapestId}
                                rank={priceRank(q)}
                                savings={maxPrice - q.price}
                                onAction={() => act(q)} />
                  ))}
                </div>
              </React.Fragment>
            )}

            <p className="disclaimer">
              Uber &amp; Bolt zijn gelabelde schattingen (geen officiële koppeling) op basis van afstand × tijd × drukte.
              TaxiGeld &amp; lokale taxi tonen vaste of geregelde tarieven. Prijzen zijn indicatief.
            </p>
          </div>

          {editing && (
            <LocationSearch
              title={editing === "origin" ? "Vertrekpunt" : "Bestemming"}
              onPick={editing === "origin" ? setOrigin : setDestination}
              onClose={() => setEditing(null)} />
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
